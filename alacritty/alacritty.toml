[window]
padding = { x = 0, y = 0 }
dynamic_padding = false
opacity = 1
blur = true
decorations = "None"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 14.0
offset = { x = 0, y = 1 }

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"
[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"
[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600

# Gruvbox Dark Hard (same values as Ghostty's built-in "Gruvbox Dark Hard").
[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"
[colors.cursor]
text = "#1d2021"
cursor = "#ebdbb2"
[colors.selection]
text = "#ebdbb2"
background = "#665c54"
[colors.normal]
black = "#1d2021"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
