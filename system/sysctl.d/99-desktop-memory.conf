# Use compressed RAM swap early instead of stalling when RAM fills up
vm.swappiness = 180
# zram has no seek cost; read one page at a time
vm.page-cluster = 0
# Keep a bit more memory free so allocations don't stall
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Flush writes in small chunks (256 MB / 1 GB) instead of up to 6.4 GB at once
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
