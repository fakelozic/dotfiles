"$schema" = 'https://starship.rs/config-schema.json'

# A prompt for reading back and pasting (to people or AI agents):
# - plain text only, no Nerd Font icons, so nothing goes blank when pasted;
# - anything colour says is also written out (exit codes, counts), because
#   colour is lost on paste;
# - one line, kept short: only the current folder, no toolchain versions;

add_newline = false

format = """
$username$hostname$directory$git_branch$git_commit$git_state$git_status$git_metrics\
$cmd_duration$status$jobs$time $character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg0 = '#282828'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#83a598'
color_aqua = '#8ec07c'
color_green = '#b8bb26'
color_orange = '#fe8019'
color_purple = '#d3869b'
color_red = '#fb4934'
color_yellow = '#fabd2f'
color_gray = '#928374'

[username]
show_always = true
style_user = "fg:color_orange bold"
style_root = "fg:color_red bold"
format = '[$user]($style)'

# Only over SSH.
[hostname]
style = "fg:color_orange bold"
format = "[@$hostname]($style)"

# Only the current folder's name (~ at home).
[directory]
style = "fg:color_blue bold"
format = " [|](fg:color_gray) [$path]($style)[$read_only]($read_only_style) "
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false
read_only = " (read-only)"
read_only_style = "fg:color_red"

# --- git: branch, then what is waiting to be committed -----------------------

[git_branch]
symbol = "git:"
only_attached = true
style = "fg:color_aqua bold"
format = "[|](fg:color_gray) [$symbol$branch]($style) "

# Only when no branch is checked out (detached HEAD): the commit or tag.
[git_commit]
style = "fg:color_aqua bold"
tag_disabled = false
tag_symbol = " tag:"
format = '[|](fg:color_gray) [detached $hash$tag]($style) '

# Only in the middle of a rebase, merge, cherry-pick or bisect.
[git_state]
style = "fg:color_yellow bold"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

# With counts, each kind in its own colour, so "3 files changed" survives a paste: !modified ?untracked
# +staged -deleted »renamed =conflicts $stashes ↑ahead ↓behind.
[git_status]
style = "fg:color_red bold"
format = '([$all_status$ahead_behind]($style))'
modified = "[!${count}](fg:color_yellow) "
untracked = "[?${count}](fg:color_gray) "
staged = "[+${count}](fg:color_green) "
deleted = "[-${count}](fg:color_red) "
renamed = "[»${count}](fg:color_purple) "
conflicted = "[=${count}](fg:color_red) "
stashed = "[\\$${count}](fg:color_purple) "
ahead = "[↑${count}](fg:color_blue) "
behind = "[↓${count}](fg:color_blue) "
diverged = "[↑${ahead_count}↓${behind_count}](fg:color_purple) "

# Lines added and removed since the last commit: shows how much an agent
# (or you) has changed at a glance.
[git_metrics]
disabled = false
added_style = "fg:color_green"
deleted_style = "fg:color_red"
format = '([\(](fg:color_gray)([+$added]($added_style))( [-$deleted]($deleted_style))[\)](fg:color_gray) )'

# --- how the last command went -----------------------------------------------

[cmd_duration]
min_time = 2000
style = "fg:color_yellow"
format = "[|](fg:color_gray) [$duration]($style) "

# "exit 1", or "exit 130 INT" after Ctrl+C. Hidden when the command succeeded.
[status]
disabled = false
style = "fg:color_red bold"
format = "[|](fg:color_gray) [exit $status( $signal_name)]($style) "

[jobs]
number_threshold = 1
symbol = ""
style = "fg:color_red bold"
format = "[|](fg:color_gray) [jobs $number]($style) "

# With seconds, to match timestamps in logs.
[time]
disabled = false
time_format = "%T"
style = "fg:color_gray"
format = '[| $time]($style)'

[character]
success_symbol = "[❯](bold fg:color_green)"
error_symbol = "[❯](bold fg:color_red)"
vimcmd_symbol = "[❮](bold fg:color_yellow)"
