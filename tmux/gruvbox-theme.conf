# Gruvbox Dark Hard theme layer (stock palette).
# bg #1d2021, raised #3c3836, border #504945, muted #a89984, text #ebdbb2, accent #fe8019
set -g status-justify left
set -g message-command-style 'fg=#ebdbb2,bg=#3c3836,align=centre'
set -g window-status-activity-style 'fg=#ebdbb2,bg=#1d2021,none'
set -g window-status-style 'fg=#a89984,bg=#1d2021,none'
set -g clock-mode-colour '#fe8019'
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-bg '#1d2021'
set -g status-fg '#ebdbb2'
set -g status-left-length 30
set -g status-right-length 80
set -g status-left '#[fg=#1d2021,bg=#{?client_prefix,#d3869b,#fabd2f},bold] 󰆍 #S #[default] '
set -g status-right '#[fg=#fe8019,bold]#{?window_zoomed_flag, ZOOM ,}#[fg=#a89984,nobold] 󰉋 #{b:pane_current_path} '
set -g window-status-separator ''
set -g window-status-format '#[fg=#a89984,bg=#1d2021] #I:#W '
set -g window-status-current-format '#[fg=#1d2021,bg=#83a598,bold] #I:#W '
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#fe8019'
set -g message-style 'fg=#ebdbb2,bg=#3c3836,bold'
set -g mode-style 'fg=#ebdbb2,bg=#504945'
