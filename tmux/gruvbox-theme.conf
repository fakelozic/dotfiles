# gruvbox-charcoal theme layer.
# bg #17191a, raised #2a2c2e, border #3a3d40, muted #899095, text #f2e8cf (cream), accent #fb8500
set -g status-justify left
set -g message-command-style 'fg=#f2e8cf,bg=#2a2c2e,align=centre'
set -g window-status-activity-style 'fg=#f2e8cf,bg=#17191a,none'
set -g window-status-style 'fg=#899095,bg=#17191a,none'
set -g clock-mode-colour '#fb8500'
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-bg '#17191a'
set -g status-fg '#f2e8cf'
set -g status-left-length 30
set -g status-right-length 80
set -g status-left '#[fg=#17191a,bg=#{?client_prefix,#d3869b,#fb8500},bold] 󰆍 #S #[default] '
set -g status-right '#[fg=#fb8500,bold]#{?window_zoomed_flag, ZOOM ,}#[fg=#899095,nobold] 󰉋 #{b:pane_current_path} '
set -g window-status-separator ''
set -g window-status-format '#[fg=#899095,bg=#17191a] #I:#W '
set -g window-status-current-format '#[fg=#f2e8cf,bg=#2a2c2e,bold] #I:#W '
set -g pane-border-style 'fg=#3a3d40'
set -g pane-active-border-style 'fg=#fb8500'
set -g message-style 'fg=#f2e8cf,bg=#2a2c2e,bold'
set -g mode-style 'fg=#f2e8cf,bg=#3a3d40'
