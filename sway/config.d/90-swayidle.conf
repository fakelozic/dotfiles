# Replaces Fedora's /usr/share/sway/config.d/90-swayidle.conf with the same
# timings, locking through ~/.local/bin/lock-screen: the Quickshell lock
# screen, or swaylock when Quickshell is not running.
#
# Lock after $lock_timeout seconds; switch displays off $screen_timeout seconds
# later, or after $screen_timeout seconds of idle while already locked.
exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT '"$HOME/.local/bin/lock-screen"' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"' \
        timeout $ST '{ [ "$(qs ipc call lock locked 2>/dev/null)" = true ] || pgrep -xu "$USER" swaylock >/dev/null; } && swaymsg "output * power off"' \
             resume 'swaymsg "output * power on"' \
        before-sleep '"$HOME/.local/bin/lock-screen"' \
        lock '"$HOME/.local/bin/lock-screen"' \
        unlock 'qs ipc call lock unlock; pkill -xu "$USER" -SIGUSR1 swaylock'
