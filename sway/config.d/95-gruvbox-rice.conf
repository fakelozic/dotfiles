# Gruvbox visual layer for Sway
default_border pixel 1
default_floating_border pixel 1
hide_edge_borders smart
smart_gaps on
gaps inner 8
gaps outer 2

client.focused          #665c54 #3c3836 #ebdbb2 #665c54 #665c54
client.focused_inactive #3c3836 #3c3836 #d5c4a1 #504945 #3c3836
client.unfocused        #282828 #282828 #a89984 #3c3836 #282828
client.urgent           #cc241d #cc241d #fbf1c7 #fb4934 #cc241d
client.placeholder      #1d2021 #1d2021 #928374 #1d2021 #1d2021

# A little breathing room around floating utilities.
for_window [floating] border pixel 1

# GNOME Calculator should behave like a small utility window.
for_window [app_id="^org[.]gnome[.]Calculator$"] floating enable
